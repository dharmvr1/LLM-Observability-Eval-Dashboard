# receivers -> processors -> exporters, joined by "pipelines".
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Waits for a whole trace to finish, then decides: keep or drop.
  # Keep 100% of traces with an error, and a percentage of the rest.
  tail_sampling:
    decision_wait: 5s
    policies:
      - name: keep-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      # Security checks must see every risky response, so keep any trace whose response text
      # looks like an SSN or an email, no matter what percentage of other traces we sample.
      - name: keep-ssn-like
        type: string_attribute
        string_attribute:
          key: gen_ai.output.messages
          values: ['\d{3}-\d{2}-\d{4}']
          enabled_regex_matching: true
      - name: keep-email-like
        type: string_attribute
        string_attribute:
          key: gen_ai.output.messages
          values: ['[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+\.[A-Za-z]{2,}']
          enabled_regex_matching: true
      - name: sample-successes
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:SUCCESS_SAMPLE_PCT}

  # The Anthropic SDK emits its own span as well as Traceloop's, both with the same token counts.
  # Counting both would double tokens and cost. We keep Traceloop's (it has the prompt and the
  # answer) and drop the SDK's own span. The raw S3 archive pipeline still receives both.
  filter/drop_anthropic_sdk_duplicate:
    error_mode: ignore
    traces:
      span:
        - 'instrumentation_scope.name == "com.anthropic.sdk.python"'

  batch:
    timeout: 1s

exporters:
  debug:
    verbosity: basic

  # Spans -> otel.otel_traces (the exporter creates the table itself).
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: otel
    username: default
    password: dev
    create_schema: true

  # Raw spans as JSON files in the bucket raw-events.
  awss3:
    marshaler: otlp_json
    s3uploader:
      region: us-east-1
      s3_bucket: raw-events
      s3_prefix: traces
      s3_partition: minute
      endpoint: http://s3:9090
      s3_force_path_style: true
      disable_ssl: true

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888   # the collector's own metrics, mapped to 127.0.0.1:8888 in docker-compose.yml
  pipelines:
    # Sampled spans go to ClickHouse for analytics.
    traces:
      receivers: [otlp]
      processors: [filter/drop_anthropic_sdk_duplicate, tail_sampling, batch]
      exporters: [debug, clickhouse]
    # EVERY span is archived raw (before sampling), so nothing is lost.
    traces/archive:
      receivers: [otlp]
      processors: [batch]
      exporters: [awss3]
