# Prometheus: every 15 seconds read the numbers our exporter publishes, then check the alert rules.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: llm-exporter           # app/jobs/metrics_exporter.py, run on the host
    static_configs:
      - targets: ["127.0.0.1:9108"]
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9091"]
  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]
